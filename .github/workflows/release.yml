name: Release

# Push a tag like `v0.1.0` to build and publish packages for all three OSes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg/.app covering Intel + Apple Silicon
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # .AppImage + .deb (AppImage runs directly, no install)
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # .msi + .exe (NSIS) installers
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RemarkBook ${{ github.ref_name }}'
          releaseBody: |
            🍦 RemarkBook ${{ github.ref_name }}

            Download the package for your OS below:
            - Windows: `*-setup.exe`
            - macOS (Intel + Apple Silicon): `*_universal.dmg`
            - Linux: `*.AppImage` (run directly)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
